services:
  - type: web
    name: dl-sca-client-monitor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AGENT_TOKEN
        generateValue: true   # Render will generate a random secret; copy it into client_agent's --token
    healthCheckPath: /healthz
